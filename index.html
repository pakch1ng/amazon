<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon Homepage Simulation</title>
    <!-- Include external CSS stylesheet located inside the css folder -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Top header-->
    <header class="header-comtainer">
      <div class="header-inner clearfix">
        <!-- logo-->
        <div class="logo-box">
          <a href="#"><img src="img/logo.png" alt="Amazon logo" /></a>
        </div>
        <!-- end of logo>
        
        <!-- Search bar -->
        <div class="search-box">
          <input type="text" class="search-input" placeholder="Search Amazon" />
          <button type="submit" class="search-btn">Search</button>
        </div>
        <!-- End search bar -->

        <!-- Account and cart link-->
        <div class="user-nev">
          <a href="#" class="nev-item">Account & lists</a>
          <a href="#" class="nev-item">Orders</a>
          <a href="#" class="nev-item cart-link"> Cart(0)</a>
        </div>
        <!-- End of account and cart link-->
      </div>
    </header>
    <!-- End of header-->

    <!-- Main content -->
    <main class="main-cintainer">
      <!-- Main banner -->
       <section class="banner-section">
        <img src="img/banner.jpg" alt="Promotion Banner" class="banner-img" />
       </section>
       <!-- End of banner-->
    </main>
      
      <!-- Product card-->
       <div class="Product card">
      <!-- First row -->
      <div class="card-row">
        <div class="product-card">
          <h2>Gaming Accessories</h2>
          <img src="img/card1.jpg" alt="Gaming" />
          <a href="#">See more</a>
        </div>
      <div class="product-card">
        <h2>Deals in Electromics</h2>
        <img src="img/card2.jpg" alt="Electromics" />
        <a href="#">Shop now</a>
      </div>
      <div class="product-card">
        <h2>Home Essemtials</h2>
        <img src="img/card3.jpg" alt="Home Decor" />
        <a href="#">Discover more</a>
      </div>
      <div class="product-card last-card">
        <h2>Fashion Trends</h2>
        <img src="img/card4.jpg" alt="Fashion" />
        <a href="#">BUY ME</a>
      </div>
      <!-- Clear the floats -->
       <div class="clear-float"></div>
      </div>
      <!-- End first row-->
     <section>
     <!-- End product cards -->
     </section> 
    </main>
    <!-- End product cards -->

    <!-- Footer-->
    <footer class="footer-container">
      <!-- back to top-->
      <div class="back to top">
        <a href="#" class="back to top">Back to top</a>
      </div>
      <!-- End of back to top-->

      <!-- Footer Text-->
      <div class="footer-links">
        <p>
          &copy; 2026 Amazon Homepage Simulation Assignment. All rights
          reserved.
        </p>
      </div>
      <!-- End of Footer Text-->
    </footer>
    <!-- End of Footer-->
  </body>
</html>
